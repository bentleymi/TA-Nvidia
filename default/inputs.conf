[script://./bin/nvidia_smi_events.py]
interval = 60
index = main
sourcetype = nvidia:smi
source = nvidia-smi
disabled = 0
python.version = python3
python.required = 3.13

[script://./bin/nvidia_smi_metrics.py]
interval = 60
index = metrics
sourcetype = nvidia:smi:metrics
source = nvidia-smi-metrics
disabled = 0
python.version = python3
python.required = 3.13

[script://$SPLUNK_HOME/etc/apps/TA-Nvidia/bin/license_beacon.py]
interval = 3600
index = main
sourcetype = ta_license:status
source = ta_license:TA-Nvidia
disabled = 0
python.version = python3
python.required = 3.13
